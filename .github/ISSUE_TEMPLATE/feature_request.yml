name: Feature request
description: Propose a bounded workflow or adapter improvement
body:
  - type: textarea
    id: goal
    attributes:
      label: User goal and current limitation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
      description: Include source protection, dependencies and a representative validation case.
    validations:
      required: true
