name: Source and release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Source inventory and identity
        run: python -B scripts/verify_release.py
      - name: Template compiler contracts
        run: python -B templates/video/test_template_library.py
      - name: Existing CLI host contracts
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Companion skill metadata and resource graph
        run: python -B scripts/check_skills.py
      - name: Build deterministic artifacts twice
        run: |
          python -B scripts/build_release.py
          python -B scripts/build_release.py --verify
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        with:
          name: release-candidates
          path: dist/*
          if-no-files-found: error
